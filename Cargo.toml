[package]
name = "nvim-notebook-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Editable Jupyter notebooks in Neovim with Rust, local Python, and Google Colab"
repository = "https://github.com/Sal-sal-sal/nvim-notebook-rs"
homepage = "https://github.com/Sal-sal-sal/nvim-notebook-rs"
readme = "README.md"
keywords = ["neovim", "notebook", "jupyter", "python", "colab"]
categories = ["command-line-utilities", "development-tools"]
publish = false
license = "MIT"

[[bin]]
name = "nvim-notebook-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
base64 = "0.23"
