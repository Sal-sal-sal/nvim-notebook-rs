name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install plot test dependency
        run: python -m pip install matplotlib
      - name: Check tag and package version
        run: |
          python - <<'PY'
          import os, tomllib
          with open('Cargo.toml', 'rb') as source:
              version = tomllib.load(source)['package']['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'tag must match Cargo.toml'
          PY
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package native worker and documentation
        env:
          TARGET_NAME: ${{ matrix.target }}
        run: |
          ./target/release/nvim-notebook-rs --version
          package="nvim-notebook-rs-$GITHUB_REF_NAME-$TARGET_NAME"
          mkdir -p "dist/$package"
          cp target/release/nvim-notebook-rs LICENSE README.md "dist/$package/"
          cp -R doc "dist/$package/"
          tar -czf "dist/$package.tar.gz" -C dist "$package"
          python - <<'PY'
          import hashlib
          from pathlib import Path
          for archive in Path('dist').glob('*.tar.gz'):
              digest = hashlib.sha256(archive.read_bytes()).hexdigest()
              archive.with_suffix(archive.suffix + '.sha256').write_text(f'{digest}  {archive.name}\n')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: worker-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    needs: [verify, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: worker-*
          merge-multiple: true
          path: dist
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes dist/*
          fi
